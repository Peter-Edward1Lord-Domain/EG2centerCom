<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Interface</title>
    
    <!-- Load the Ultra-Fast, Secure Lottie Framework Player Engine -->
    <script src="https://cloudflare.com"></script>

<style>
        body {
            background-color: #21ADA8; /* Your exact brand aquamarine background */
            padding: 50px;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }

        /* --- THE CYBERPUNK BUTTON CONTAINER (TACTICAL METALLIC) --- */
        .cyber-button-container {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 320px;   
            height: 85px;   
            margin: 20px;
            text-decoration: none;
            cursor: pointer;
            
            /* High-Contrast Standout styling */
            background-color: #05080a; /* Deep obsidian black core so elements pop */
            border: 2px solid #b0b7bd; /* Brushed silver metal edge framing */
            border-radius: 4px;        /* Clean structural geometric corners */
            
            /* Deep silhouette shadow to separate the black button from the aquamarine background */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 
                        inset 0 0 10px rgba(176, 183, 189, 0.2); 
            
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        border-color 0.2s ease, 
                        box-shadow 0.2s ease;
        }

        /* Hover Interaction: Overclocks the internal machinery and brightens the silver frame */
        .cyber-button-container:hover {
            transform: scale(1.04);
            border-color: #ffffff; /* Silver shifts to a shining polished chrome */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 
                        0 0 15px rgba(0, 255, 0, 0.3); /* Passes a minor green aura outward */
        }

        /* The Lottie Vector Hardware Animation Canvas Layer playing inside the black core */
        .lottie-hardware-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; 
            opacity: 0.85; /* Keeps the green wires cleanly balanced against the black background */
            filter: drop-shadow(0 0 6px rgba(0, 255, 0, 0.5)); 
        }

        /* The Automated Text Layer floating perfectly on top of the black core */
        .cyber-button-text {
            position: relative;
            z-index: 2;
            color: #00ff00; /* Neon Matrix Green */
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 5px #00ff00, 0 0 10px rgba(0, 255, 0, 0.4);
            transition: all 0.2s ease;
        }

        /* Shifting hover alignment */
        .cyber-button-container:hover .cyber-button-text {
            color: #ffffff; /* Text turns pure white for maximum readability inside the button */
            text-shadow: 0 0 8px #00ff00, 0 0 20px #00ff00; /* Intensifies the green matrix glare behind it */
        }

/* Core Structural Layout Rules for the Footer Container */
.site-corporate-footer {
    width: 100%;
    margin-top: 60px; /* Pushes it cleanly below your central table elements */
    padding: 20px 0;
    clear: both;      /* Safely forces it to break away from tables above it */
    text-align: center;
}

.footer-content-wrapper {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 15px;
}

.copyright-text, .trademark-text {
    font-family: Arial, sans-serif;
    font-size: 0.85rem;
    line-height: 1.6;
    color: #888888; /* Soft grey text so it stays elegant and out of the way */
    margin: 4px 0;
}

    </style>

</head>
<body>
<center>
    <!-- BUTTON 1: Go to Modern Portal (Simply swap the link path and text inside) -->
    <a href="enteremail.html" class="cyber-button-container">
        <!-- The Infinite Vector Hardware Animation Canvas Layer -->
        <div class="lottie-hardware-bg" data-animation="cyber-circuit"></div>
        <!-- TYPE ANY WORDS YOU WANT HERE -->
        <span class="cyber-button-text">ENTER YOU EMAIL ADDRESS FOR MORE INFO</span>
    </a>

    <!-- BUTTON 2: Return to Archive Link Example -->
    <a href="indexmajor.htm" class="cyber-button-container">
        <div class="lottie-hardware-bg" data-animation="cyber-circuit"></div>
        <!-- AUTOMATED CUSTOM TEXT EXAMPLE -->
        <span class="cyber-button-text">LAUNCH 1999 NODE</span>
    </a>

    <script>
        // Automated script initialization loops over your buttons on page load
        document.querySelectorAll('.lottie-hardware-bg').forEach(container => {
            lottie.loadAnimation({
                container: container,
                renderer: 'svg', // Forces razor-sharp mathematical vectors instead of pixels
                loop: true,
                autoplay: true,
                // Loads an official, public domain futuristic tech wireframe grid
                path: 'https://lottiefiles.com' 
            });
        });
    </script>

<!-- THE PROPER SEMANTIC HTML5 FOOTER CONTAINER -->
<footer class="site-corporate-footer">
    <div class="footer-content-wrapper">
        <p class="copyright-text">
            Copyright &copy; 1994&ndash;<script>document.write(new Date().getFullYear());</script> EnternetGlobal LLC. All Rights Reserved.
        </p>
        <p class="trademark-text">
            EnternetGlobal&trade;, EntertainmentGiant&trade;, and EG2CENTER&trade; are trademarks of EnternetGlobal LLC.
        </p>
    </div>
</footer>

</body>
</html>
